<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Untitled - TabIt</title>
<link rel="stylesheet" href="style.css">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000080'/%3E%3Ctext x='8' y='12' font-family='Courier New' font-size='11' font-weight='bold' fill='%23ffff00' text-anchor='middle'%3ET%3C/text%3E%3C/svg%3E">
</head>
<body>
<div id="appwindow">
  <div id="titlebar">
    <span id="titleicon">T</span>
    <span id="titletext">Untitled - TabIt</span>
    <span id="titlebuttons">
      <span class="titlebtn">_</span><span class="titlebtn">&#9633;</span><span class="titlebtn">&#10005;</span>
    </span>
  </div>
  <div id="menubar"></div>
  <div id="editorpane">
    <canvas id="tabcanvas"></canvas>
  </div>
  <div id="statusbar">
    <span class="statuspanel" id="st-track"> Track: 1</span>
    <span class="statuspanel" id="st-bar"> Bar: 1</span>
    <span class="statuspanel" id="st-mode"></span>
    <span class="statuspanel statuswide" id="st-hint"></span>
  </div>
</div>
<div id="dialoglayer" hidden></div>
<input type="file" id="fileinput" accept=".tbt,.json,.tabit.json" hidden>
<script src="tbt.js"></script>
<script src="app.js"></script>
</body>
</html>
